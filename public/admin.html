<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clarity Console — Admin</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0;padding:0;font-family:'Inter',system-ui,sans-serif;background:#0f1419;color:#e8e4db;}
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .login-card{background:#1c2733;border:1px solid #2e3d4d;border-radius:12px;padding:36px 32px;width:100%;max-width:380px;}
  .login-card h1{font-size:20px;margin:0 0 6px;color:#fff;}
  .login-card p{color:#9baab8;font-size:14px;margin:0 0 24px;}
  label{display:block;font-size:12px;font-weight:600;color:#9baab8;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;}
  input{width:100%;padding:11px 13px;border:1px solid #2e3d4d;border-radius:8px;font-size:15px;background:#0f1419;color:#e8e4db;margin-bottom:16px;}
  input:focus{outline:none;border-color:#c9a227;}
  .btn{width:100%;background:#c9a227;color:#0f1419;border:none;padding:13px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;}
  .btn:hover{background:#ddb73a;}
  .btn:disabled{opacity:0.6;cursor:not-allowed;}
  .err{color:#a85d4f;font-size:13px;margin:-8px 0 14px;}
  .hidden{display:none!important;}

  /* Dashboard */
  .dashboard{min-height:100vh;padding:32px;}
  .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px;padding-bottom:16px;border-bottom:1px solid #2e3d4d;}
  .header h1{font-size:20px;margin:0;color:#c9a227;}
  .logout-btn{background:none;border:1px solid #2e3d4d;color:#9baab8;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;}
  .logout-btn:hover{border-color:#c9a227;color:#c9a227;}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:32px;}
  .stat{background:#1c2733;border:1px solid #2e3d4d;border-radius:10px;padding:20px;}
  .stat .num{font-size:32px;font-weight:700;color:#c9a227;font-family:monospace;}
  .stat .label{font-size:12px;color:#9baab8;text-transform:uppercase;letter-spacing:0.05em;margin-top:4px;}
  .table-wrap{background:#1c2733;border:1px solid #2e3d4d;border-radius:10px;overflow:hidden;}
  .table-header{padding:16px 20px;border-bottom:1px solid #2e3d4d;font-size:13px;font-weight:700;color:#9baab8;text-transform:uppercase;letter-spacing:0.05em;}
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;padding:12px 20px;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:#9baab8;border-bottom:1px solid #2e3d4d;font-weight:700;}
  td{padding:14px 20px;font-size:13px;border-bottom:1px solid #1c2733;vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:rgba(201,162,39,0.05);}
  .email{color:#e8e4db;font-weight:600;}
  .date{color:#9baab8;font-size:12px;font-family:monospace;}
  .tools{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
  .tool-tag{background:rgba(201,162,39,0.15);color:#c9a227;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
  .tool-tag.engine{background:rgba(107,143,113,0.15);color:#6b8f71;}
  .no-tools{color:#4a5568;font-size:12px;}
  .refresh-btn{background:none;border:1px solid #2e3d4d;color:#9baab8;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;margin-left:12px;}
  .refresh-btn:hover{border-color:#c9a227;color:#c9a227;}
  @media(max-width:720px){.stats{grid-template-columns:1fr;}.dashboard{padding:16px;}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" class="login-wrap">
  <div class="login-card">
    <h1>Admin Panel</h1>
    <p>Clarity Console — admin access only</p>
    <div>
      <label>Username</label>
      <input type="text" id="admin-user" autocomplete="off">
      <label>Password</label>
      <input type="password" id="admin-pass">
      <div class="err hidden" id="admin-err"></div>
      <button class="btn" id="admin-submit" onclick="adminLogin()">Sign In</button>
    </div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="dashboard hidden">
  <div class="header">
    <h1>⚡ Clarity Console — Admin</h1>
    <div>
      <span id="last-updated" style="color:#9baab8;font-size:12px;"></span>
      <button class="refresh-btn" onclick="loadUsers()">↻ Refresh</button>
      <button class="logout-btn" onclick="adminLogout()">Log out</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="num" id="stat-total">—</div>
      <div class="label">Total Users</div>
    </div>
    <div class="stat">
      <div class="num" id="stat-week">—</div>
      <div class="label">Joined This Week</div>
    </div>
    <div class="stat">
      <div class="num" id="stat-active">—</div>
      <div class="label">Active Last 7 Days</div>
    </div>
  </div>

  <div class="table-wrap">
    <div class="table-header">All Users</div>
    <table>
      <thead>
        <tr>
          <th>Email</th>
          <th>Signed Up</th>
          <th>Last Login</th>
          <th>Tools Used</th>
        </tr>
      </thead>
      <tbody id="user-table">
        <tr><td colspan="4" style="color:#9baab8;text-align:center;padding:32px;">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const TOOL_LABELS = {
  truth: 'Cash Truth Check',
  lag: 'Cash Lag Calculator',
  quiz: 'Am I Okay? Quiz',
  pnl: 'Read Your P&L',
  breakeven: 'Break-Even Reveal',
  tracker: 'Money Tracker',
  snapshot: 'Profit Snapshot',
  forecast: '90-Day Forecaster',
  engine: 'Forecasting Engine',
};

async function adminLogin() {
  const username = document.getElementById('admin-user').value;
  const password = document.getElementById('admin-pass').value;
  const errEl = document.getElementById('admin-err');
  const btn = document.getElementById('admin-submit');
  errEl.classList.add('hidden');
  btn.disabled = true;
  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ username, password })
    });
    const body = await res.json();
    if (!res.ok) {
      errEl.textContent = body.error || 'Invalid credentials';
      errEl.classList.remove('hidden');
      btn.disabled = false;
      return;
    }
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');
    loadUsers();
  } catch(e) {
    errEl.textContent = 'Could not connect to server.';
    errEl.classList.remove('hidden');
    btn.disabled = false;
  }
}

async function adminLogout() {
  await fetch('/api/admin/logout', { method: 'POST', credentials: 'include' });
  document.getElementById('dashboard').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('admin-pass').value = '';
}

async function loadUsers() {
  try {
    const res = await fetch('/api/admin/users', { credentials: 'include' });
    if (res.status === 401) {
      document.getElementById('dashboard').classList.add('hidden');
      document.getElementById('login-screen').classList.remove('hidden');
      return;
    }
    const body = await res.json();
    const users = body.users || [];
    renderStats(users);
    renderTable(users);
    document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch(e) {
    console.error('Load users error:', e);
  }
}

function renderStats(users) {
  const now = new Date();
  const weekAgo = new Date(now - 7 * 24 * 60 * 60 * 1000);
  const joinedThisWeek = users.filter(u => new Date(u.created_at) > weekAgo).length;
  const activeLastWeek = users.filter(u => u.last_login && new Date(u.last_login) > weekAgo).length;
  document.getElementById('stat-total').textContent = users.length;
  document.getElementById('stat-week').textContent = joinedThisWeek;
  document.getElementById('stat-active').textContent = activeLastWeek;
}

function renderTable(users) {
  const tbody = document.getElementById('user-table');
  if (users.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" style="color:#9baab8;text-align:center;padding:32px;">No users yet.</td></tr>';
    return;
  }
  tbody.innerHTML = users.map(u => {
    const tools = u.tools_used || [];
    const toolTags = tools.length > 0
      ? tools.map(t => `<span class="tool-tag ${t==='engine'?'engine':''}">${TOOL_LABELS[t]||t}</span>`).join('')
      : '<span class="no-tools">None yet</span>';
    return `<tr>
      <td><div class="email">${escHtml(u.email)}</div></td>
      <td><div class="date">${formatDate(u.created_at)}</div></td>
      <td><div class="date">${u.last_login ? formatDate(u.last_login) : '—'}</div></td>
      <td><div class="tools">${toolTags}</div></td>
    </tr>`;
  }).join('');
}

function formatDate(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
    + ' ' + d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
}

function escHtml(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Allow Enter key to submit login
document.getElementById('admin-pass').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') adminLogin();
});
document.getElementById('admin-user').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') adminLogin();
});
</script>
</body>
</html>
